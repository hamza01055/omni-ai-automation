# Single entrypoint for local/prod: dashboard at /, API at /api, n8n at /n8n.
upstream backend  { server backend:8000; }
upstream frontend { server frontend:5173; }
upstream n8n      { server n8n:5678; }

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # knowledge-base uploads

    # Security headers. HSTS is intentionally left to the TLS terminator.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ { proxy_pass http://backend; }
    location /docs    { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }

    # Realtime inbox updates
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    location /n8n/ {
        proxy_pass http://n8n/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # Vite HMR
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
    }
}
